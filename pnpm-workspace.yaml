packages:
  # configs/ holds tenant JSON, not packages — deliberately not a workspace.
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks lifecycle scripts unless a dependency is allow-listed here.
# Keep this list minimal and justified — every entry runs arbitrary code at install time.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - '@tailwindcss/oxide'
  # wrangler ships workerd as a platform binary that its postinstall unpacks.
  # Without this entry every install prints an "ignored build scripts" warning
  # and `wrangler dev` fails at first run with a missing binary. Allow-listed
  # by name rather than by enabling lifecycle scripts globally.
  - workerd
