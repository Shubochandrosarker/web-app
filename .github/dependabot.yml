# Dependency currency, on a cadence a small team can absorb: one weekly batch
# per ecosystem, grouped so routine minor/patch bumps arrive as a single PR
# instead of thirty.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
