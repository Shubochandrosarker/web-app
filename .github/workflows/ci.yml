name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run this whole workflow as its verification stage.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full tree, deliberately: a changed-files check lets historical files
      # drift and turns "the repository is formatted" into a lie by increments.
      - name: Format check
        run: pnpm run format:check

      # `next lint` was removed in Next 16. This runs ESLint over every app and
      # package from the root flat config — the step is named "lint" and now
      # actually lints, which it did not before.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          # The site build bakes in the tenant's brand and canonical origin, so
          # a build needs to know which workspace it is for. CI builds the
          # reference tenant; a release pipeline sets the client's slug.
          BOS_WORKSPACE_SLUG: nuesheba
          NEXT_PUBLIC_SITE_URL: https://nuesheba.com
          NEXT_PUBLIC_API_URL: https://api.nuesheba.com
          NEXT_PUBLIC_DASHBOARD_URL: https://app.nuesheba.com

  test:
    name: Tests against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bos
          POSTGRES_PASSWORD: bos
          POSTGRES_DB: bos_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bos -d bos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The API's rate limits, session cache and idempotency claims are Redis
      # operations. Faking them would test a different program.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a clean database
        run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_ci

      # ---------------------------------------------------------------------
      # The application role.
      #
      # `pnpm db:migrate` creates `bos_app` as NOLOGIN, because a committed
      # password is not a password. CI gives it one so the test suite can
      # connect as the role production uses.
      #
      # This is not a convenience. Row-level security does not apply to a
      # superuser, to a role with BYPASSRLS, or (without FORCE) to the table
      # owner — so a suite connected as `bos` would pass every cross-tenant
      # test while the boundary was wide open. The harness refuses to run as
      # such a role; this is what gives it one that binds.
      # ---------------------------------------------------------------------
      - name: Grant the application role a CI password
        run: |
          PGPASSWORD=bos psql -h localhost -U bos -d bos_ci \
            -c "ALTER ROLE bos_app WITH LOGIN PASSWORD 'bos_app_ci';"

      - name: Verify tenant isolation against the real database
        run: pnpm --filter @bos/database run test
        env:
          DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_ci

      - name: Run every test suite
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_ci
          # The API suite connects as the least-privilege role, so its
          # isolation assertions are about isolation rather than about nothing.
          TEST_DATABASE_URL: postgresql://bos_app:bos_app_ci@localhost:5432/bos_ci
          REDIS_URL: redis://localhost:6379

      - name: Fail if the Drizzle schema has ungenerated changes
        run: |
          pnpm run db:generate
          if ! git diff --exit-code -- packages/database/drizzle; then
            echo "::error::Drizzle schema changed without a committed migration. Run pnpm db:generate."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_ci

  # ---------------------------------------------------------------------------
  # The vertical slice, end to end.
  #
  # The unit suites prove the pieces; this proves they are connected. It is the
  # check that caught a PATCH silently wiping page bodies, a publish handler
  # that revalidated nothing, a service-request form nobody could submit, and a
  # redirect loop — none of which any unit test noticed, because each piece was
  # individually correct.
  #
  # It was written before this job existed and had to be run by hand, which
  # means it only ran when somebody remembered to.
  # ---------------------------------------------------------------------------
  smoke:
    name: Vertical slice against a running stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bos
          POSTGRES_PASSWORD: bos
          POSTGRES_DB: bos_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bos -d bos_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_smoke
      # The Postgres service container speaks plaintext. Without this, the API
      # started with NODE_ENV=production would resolve DATABASE_SSL to
      # verify-full and refuse to connect — the production default, which is
      # correct there and wrong against a throwaway container here.
      DATABASE_SSL: disable
      REDIS_URL: redis://localhost:6379
      BOS_WORKSPACE_SLUG: nuesheba
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3001
      # Test values, and only ever test values. Every one of these is a
      # Wrangler or host secret in a real environment; see
      # docs/deployment/environments.md.
      AUTH_SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      EDGE_SHARED_SECRET: ci-edge-shared-secret-at-least-32-characters
      ANALYTICS_HASH_SECRET: ci-analytics-secret-at-least-32-characters-ok
      BOS_OWNER_PASSWORD: ci-owner-password-not-a-real-one
      BOS_ALLOW_INDEXING: 'false'
      EMAIL_FROM_ADDRESS: noreply@example.com
      EMAIL_FROM_NAME: Business OS CI

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm run db:migrate

      - name: Provision the reference tenant
        run: pnpm run workspace:provision nuesheba

      # A provisioned workspace has a brand, a pipeline and a form, and no
      # pages — content is authored, not generated. This adds the fixture
      # pages and the fixture service the smoke test walks. See the header of
      # scripts/seed-smoke.ts for why the copy is deliberately worthless.
      - name: Seed fixture content
        run: pnpm run workspace:seed-smoke nuesheba

      - name: Build
        run: pnpm run build

      # `next start` serves the built site and dashboard; the API runs its
      # COMPILED bundle (dist/server.js) — the artifact a deploy ships, not
      # the source tree. NODE_ENV stays development on purpose: the
      # production guard demands a real email provider, CAPTCHA keys and a
      # verified database certificate, none of which a throwaway CI stack
      # has, and weakening the guard to satisfy CI would invert its point.
      # The guard itself is covered by unit tests over assertProductionSafe.
      - name: Start the API (compiled bundle)
        run: |
          cd apps/api
          NODE_ENV=development LOG_LEVEL=warn API_PORT=4000 \
            API_PUBLIC_URL=http://localhost:4000 \
            API_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001 \
            DASHBOARD_URL=http://localhost:3001 \
            nohup node dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4000/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::The API never became healthy."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Start the site
        run: |
          cd apps/site
          NODE_ENV=production PORT=3000 \
            nohup npx next start --port 3000 > "$RUNNER_TEMP/site.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "::error::The site never became reachable."
          cat "$RUNNER_TEMP/site.log"
          exit 1

      - name: Start the dashboard
        run: |
          cd apps/dashboard
          NODE_ENV=production PORT=3001 \
            nohup npx next start --port 3001 > "$RUNNER_TEMP/dashboard.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3001/sign-in && exit 0
            sleep 1
          done
          echo "::error::The dashboard never became reachable."
          cat "$RUNNER_TEMP/dashboard.log"
          exit 1

      # `--submit-form` posts a real service request and asserts a lead exists
      # afterwards. Nothing short of that exercises the path the business
      # depends on.
      - name: Walk the vertical slice
        run: |
          pnpm smoke \
            --site http://localhost:3000 \
            --api http://localhost:4000 \
            --dashboard http://localhost:3001 \
            --workspace nuesheba \
            --service-path /services/smoke-test-service \
            --submit-form

      - name: Verify every redirect resolves in one hop
        run: pnpm redirects:verify nuesheba --base http://localhost:3000

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Accessibility (axe, WCAG A/AA), keyboard operability and a mobile
      # viewport, against the same running stack the slice just walked.
      - name: Accessibility and keyboard end-to-end
        run: pnpm e2e

      # Lighthouse on the two pages that earn the traffic.
      #
      # Accessibility is binding (>= 95, matching TASK-302); it scored 100 on
      # every observed run and regressions in it are real signal.
      # Performance is MEASURED AND PRINTED but not binding here: identical
      # code scored 90 and then 81 on consecutive shared-runner runs, so any
      # threshold either flakes or means nothing — the binding >= 95
      # performance bar is the staging Lighthouse run on real hardware in
      # docs/deployment/go-live.md, the same advisory-in-CI/binding-at-release
      # split the tenant-readiness check uses. The SEO category is not
      # budgeted at all: CI runs with BOS_ALLOW_INDEXING=false, so the page
      # is (correctly) noindexed and Lighthouse caps the category — staging,
      # which is indexable, owns that number.
      - name: Lighthouse budget
        run: |
          for path in / /services/smoke-test-service; do
            npx --yes lighthouse@12 "http://localhost:3000$path" \
              --only-categories=performance,accessibility \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path="$RUNNER_TEMP/lh.json" --quiet
            node -e '
              const report = require(process.env.RUNNER_TEMP + "/lh.json");
              const scores = Object.fromEntries(
                Object.entries(report.categories).map(([k, v]) => [k, Math.round(v.score * 100)]),
              );
              console.log(report.finalDisplayedUrl, JSON.stringify(scores));
              const failures = [];
              if (scores.accessibility < 95) failures.push(`accessibility ${scores.accessibility} < 95`);
              if (failures.length) { console.error(failures.join("; ")); process.exit(1); }
            '
          done

      - name: Server logs
        if: failure()
        run: |
          for name in api site dashboard; do
            echo "::group::$name"
            cat "$RUNNER_TEMP/$name.log" || true
            echo "::endgroup::"
          done

  tenant-config:
    name: Tenant configuration is production-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # The launch gate.
      #
      # Fails while any tenant config still carries a placeholder phone number,
      # email or address. Those values are published as the business's NAP in
      # LocalBusiness structured data and in the footer of every page —
      # inconsistent NAP data is difficult to correct once aggregators have it,
      # so this is a blocker rather than a warning.
      #
      # `continue-on-error` while NuESheba's real details are outstanding: the
      # report is visible on every run, and the job turns red without blocking
      # unrelated work. Remove it as part of the go-live checklist.
      # ---------------------------------------------------------------------
      - name: Check tenant configuration
        run: pnpm run check:readiness
        continue-on-error: true

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory here, binding in release.yml — the report shows on every
      # run without blocking unrelated work on an upstream advisory.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
